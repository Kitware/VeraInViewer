name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx nox -s lint

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Headless OpenGL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libosmesa6
          echo "VTK_DEFAULT_OPENGL_WINDOW=vtkOSOpenGLRenderWindow" >> "$GITHUB_ENV"
      # GPU-less Windows runners have no usable OpenGL: LocalView's Render() segfaults.
      # Deploy Mesa (llvmpipe + OSMesa) system-wide and point VTK at vtkOSOpenGLRenderWindow.
      - name: Headless OpenGL (Windows)
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@v5
        with:
          pyvista: false
      - run: uvx nox -s "tests-${{ matrix.python }}"

  release:
    # Only cut releases from pushes to the default branch, once lint + tests pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, tests]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/vera-in-viewer
    permissions:
      contents: write # push version commit/tag + create GitHub release
      id-token: write # PyPI trusted publishing
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # Make sure we release from the tip of the branch (avoid racing a newer push).
      - name: Reset to workflow SHA
        run: git reset --hard ${{ github.sha }}

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload artifacts to GitHub release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

  electron:
    # Build the desktop app on each OS (builds are not cross platform) and attach the
    # installers to the GitHub release created above.
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: write # upload release assets
    defaults:
      run:
        shell: bash
        working-directory: electron
    env:
      # No signing identities configured: don't let electron-builder look for one.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Sync app version with the release
        run: npm version "${{ needs.release.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - name: Freeze the trame server (PyInstaller)
        run: npm run build:server
      - name: Build installers (electron-builder)
        run: npm run dist -- --publish never

      - name: Upload installers to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found in electron/dist" >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "${{ needs.release.outputs.tag }}" "${files[@]}" --clobber
